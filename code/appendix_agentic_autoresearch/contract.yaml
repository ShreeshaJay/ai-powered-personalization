# Pre-registered before any trial. Do not edit this file to explain a result.
# The auditor records sealed-file hashes in the run directory when the
# harness is built. Those hashes are not known until the rows exist.

manifest_id: appendix_c_chapter6_ranker_v1
task: pointwise_listen_completion
label_definition: "played_ratio_pct >= 50"
label_threshold: 50
primary_metric: auc_roc
primary_split: validation
direction: maximize

split:
  train_days: 7
  validation_days: 1
  test_days: 1
  gap_seconds: 1800
  early_stopping_fraction: 0.10
  timestamp_unit: seconds

seeds:
  master: 20261109

# Full Yambda run. Three search trials per arm, plus the five baseline
# seeds required by the noise-band method. Replay is off unless requested.
trial_budget_per_arm: 3
per_trial_timeout_seconds: 600
test_budget: 3
test_candidates:
  - baseline
  - random
  - greedy
n_jobs: 1

baseline:
  n_estimators: 100
  max_depth: 6
  learning_rate: 0.1
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  scale_pos_weight: 1.0
  early_stopping_rounds: 10
  eval_metric: auc

noise_band:
  method: baseline_seeds_plus_user_bootstrap
  baseline_seeds: 5
  bootstrap_replicates: 200
  bootstrap_unit: user
  statistic: max_of_sample_stds

promotion_threshold:
  rule: winner_validation_auc_minus_baseline_mean_gt_noise_band

guardrails:
  max_log_loss: 1.5
  max_expected_calibration_error: 0.35

# Scale knobs for --synthetic. They do not change the pre-registered method.
# Tree-size clips keep the whole pipeline, including the seal, near one minute.
synthetic:
  trial_budget_per_arm: 2
  include_replay: true
  bootstrap_replicates: 200
  clip_n_estimators: 12
  clip_max_depth: 3
  clip_early_stopping_rounds: 3
  users: 24
  items: 12
  rows_history: 180
  rows_train: 420
  rows_validation: 80
  rows_test: 80
